name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("src/maxpyin/_version.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', text)
          if match is None:
              raise SystemExit("version string was not found")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              raise SystemExit(f"tag {tag} does not match version {version}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
